# The watchdog: every night, re-read OneAquaHealth's public data, rebuild the
# check-up, and commit what changed. The site redeploys from the commit.
name: Nightly check-up

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checkup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Copy the public data
        run: python3 scripts/fetch.py
      - name: Run the rules
        run: |
          python3 -m unittest discover -s tests
          python3 scripts/build.py
      - name: Commit the new snapshot
        run: |
          git config user.name "stream-checkup-bot"
          git config user.email "stream-checkup-bot@users.noreply.github.com"
          git add data web/public/data.json
          git diff --cached --quiet || git commit -m "Nightly check-up $(date -u +%F)"
          git push
